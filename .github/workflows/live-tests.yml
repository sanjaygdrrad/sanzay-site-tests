name: Live site tests

on:
  schedule:
    - cron: "17 2 * * *"        # every day at 02:17 UTC (08:02 in Nepal)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-tests
  cancel-in-progress: true

jobs:
  test:
    name: Test https://sanzay.com.np
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble   # keep in step with @playwright/test
      options: --user 1001
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test tools
        run: npm ci

      - name: Run tests against the live site (desktop + phone)
        run: npx playwright test

      - name: Prepare the public report
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  report:
    name: Publish report
    if: always() && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
